<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'" />
<title>Clarity · 需求表达训练台</title>
<style>
:root { color-scheme: light; --bg:#f7f8f6; --surface:#fff; --ink:#182122; --muted:#647070; --line:#dde4df; --blue:#194ed0; --soft:#edf2ff; --good:#0b7547; --goodbg:#e8f8f0; --warn:#8d5b08; --warnbg:#fff6e6; --r:17px; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif; font-size:14px; line-height:1.6; }
button,textarea,input { font:inherit; }
button { cursor:pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid #96b5ff;outline-offset:3px; }
a { color:var(--blue);text-decoration:none; }
a:hover { text-decoration:underline; }
.shell { max-width:1130px; margin:0 auto; padding:0 34px 70px; }
.top { min-height:83px;display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line);gap:16px; }
.brand { display:flex;align-items:center;gap:12px;font-size:20px;font-weight:750;letter-spacing:-.05em; }
.mark { width:31px;height:31px;border-radius:10px;background:var(--blue);color:white;display:grid;place-items:center;font-size:19px;font-weight:550; }
.brand small { font-weight:450;font-size:12px;letter-spacing:.02em;color:var(--muted);padding-left:5px; }
.topActions { display:flex;align-items:center;gap:13px; }
.tinyBadge { font-size:11px;letter-spacing:.025em;color:var(--good);padding:5px 10px;background:var(--goodbg);border-radius:50px;white-space:nowrap; }
.minilink { background:none;border:0;padding:6px 0;color:var(--muted);font-size:12px; }
.hero { display:flex;align-items:end;justify-content:space-between;gap:20px;margin:54px 0 36px; }
.eyebrow { font-size:11px;letter-spacing:.12em;color:var(--blue);font-weight:700; }
h1 { font-weight:720; font-size:clamp(30px,4.5vw,49px); letter-spacing:-.065em;line-height:1.14;margin:9px 0 13px; }
.sub { color:var(--muted);font-size:14px;max-width:630px;margin:0; }
.stepper { display:flex; gap:7px; align-items:center; }
.step { font-size:11px;display:flex;align-items:center;gap:7px;padding:8px 9px; color:#8b9591;white-space:nowrap; }
.step .n { display:grid;place-items:center;width:22px;height:22px;border:1px solid #dce4df;border-radius:50%;font-size:10px; }
.step.active { color:var(--blue);font-weight:700; }
.step.active .n { background:var(--blue);border-color:var(--blue);color:#fff; }
.step.done { color:var(--good); }
.step.done .n { background:var(--goodbg);border-color:var(--goodbg); }
.layout { display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,.85fr);gap:20px;align-items:start; }
.panel { background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:29px;box-shadow:0 6px 30px rgba(30,48,35,.025); }
.side { display:grid;gap:16px; }
h2 { font-size:23px;letter-spacing:-.04em;line-height:1.3;margin:7px 0 9px; }
h3 { font-size:15px;letter-spacing:-.025em;margin:0 0 8px; }
p { margin:7px 0 12px; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.micro { font-size:11px; }
.divider { height:1px;background:var(--line);margin:23px 0; }
.label { color:var(--muted);font-size:11px;letter-spacing:.06em;font-weight:700;margin-bottom:9px;display:block; }
.scenarios { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
.scenario { text-align:left;border:1px solid var(--line);border-radius:12px;padding:15px 15px 13px;background:white;min-height:105px;transition:.15s; }
.scenario:hover,.scenario.selected { border-color:var(--blue);background:#f8faff; }
.scenario.selected { box-shadow:0 0 0 1px var(--blue) inset; }
.scenario b { display:block;font-size:13px;margin:4px 0 5px; }
.scenario span { display:block;color:var(--muted);font-size:11px;line-height:1.5; }
.scenario .num { color:var(--blue);font-weight:650;font-size:10px; }
textarea, input[type="text"] { width:100%;border:1px solid #ccd6cf;background:#fff;border-radius:12px;resize:vertical;padding:13px 14px;color:var(--ink);line-height:1.7;min-height:102px;outline:none; }
textarea:focus { border-color:var(--blue); }
.help { color:var(--muted);font-size:11px;line-height:1.55;margin-top:6px; }
.row { display:flex;align-items:center;gap:10px;flex-wrap:wrap; }
.between { justify-content:space-between; }
.btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border:1px solid var(--line);border-radius:10px;font-weight:620;background:white;color:var(--ink);font-size:12px;white-space:nowrap; }
.btn.primary { color:white;background:var(--blue);border-color:var(--blue); }
.btn.primary:hover { background:#113eab; }
.btn.ghost { border-color:transparent;color:var(--muted);background:transparent; }
.btn.smallbtn { padding:8px 12px;font-size:11px; }
.btn:disabled { opacity:.4;cursor:not-allowed; }
.lightBox { border-radius:12px;background:#f3f6f3;padding:16px 17px; }
.callout { border-radius:12px;background:var(--soft);padding:14px 16px;font-size:12px;line-height:1.65; }
.callout.ok { background:var(--goodbg);color:#0a5a37; }
.callout.warn { background:var(--warnbg);color:#71501c; }
.tag { color:var(--blue);font-size:10px;font-weight:700;letter-spacing:.09em; }
.ruleList { margin:13px 0 0;padding:0;list-style:none; }
.ruleList li { display:flex;gap:11px;padding:8px 0;color:var(--muted);font-size:12px; }
.ruleList em { font-style:normal;color:var(--blue);width:18px;flex-shrink:0;font-weight:700; }
.method { font-size:12px;padding:10px 0;border-bottom:1px solid var(--line); }
.method:last-child { border-bottom:0; }
.method span { display:block;color:var(--muted);font-size:11px; }
.progress { display:flex;gap:5px;margin:19px 0 25px; }
.progress i { display:block;height:5px;border-radius:4px;flex:1;background:#e9eeeb; }
.progress i.filled { background:var(--blue); }
.q { font-size:clamp(22px,2.8vw,29px);letter-spacing:-.045em;line-height:1.4;font-weight:720;margin:9px 0 13px; }
.prompt { color:var(--muted);margin-bottom:19px; }
.history { max-height:260px;overflow:auto;display:grid;gap:11px; }
.historyItem { padding-bottom:12px;border-bottom:1px solid var(--line); }
.historyItem:last-child { border:0; }
.historyItem strong { font-size:12px;display:block; }
.historyItem p { color:var(--muted);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:5px 0; }
.completeBadge { color:var(--good);font-size:11px;font-weight:700; }
.brief { display:grid;gap:12px; }
.briefItem { border:1px solid var(--line);border-radius:11px;padding:13px 15px; }
.briefItem .briefHead { display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-bottom:4px; }
.briefItem p { font-size:12px;margin:0;white-space:pre-wrap;overflow-wrap:anywhere; }
.pending { color:var(--warn);background:var(--warnbg);border-radius:5px;padding:1px 5px; }
.choiceSet { display:grid;gap:9px;margin:18px 0; }
.choice { width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:white;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink); }
.choice:hover,.choice.selected { border-color:var(--blue);background:#f7f9ff; }
.radio { border:1px solid #bfc9c5;width:18px;height:18px;border-radius:100%;display:inline-grid;place-items:center;flex-shrink:0; }
.choice.selected .radio { background:var(--blue);border-color:var(--blue);color:white; }
.score { display:flex;gap:18px;align-items:center; }
.bigscore { font-size:67px;line-height:1;font-weight:740;letter-spacing:-.09em; }
.scoreOutOf { color:var(--muted);font-size:19px; }
.bar { width:100%;height:8px;border-radius:5px;background:#e6ebe7;overflow:hidden; }
.barFill { height:100%;background:var(--blue);transition:width .3s; }
.scoreItem { display:flex;justify-content:space-between;gap:15px;padding:11px 0;border-bottom:1px solid var(--line); }
.scoreItem b { font-size:12px; }
.scoreItem span { font-size:11px;color:var(--muted);display:block; }
.scoreItem strong { font-size:14px;white-space:nowrap; }
.note { border-left:2px solid var(--blue);padding-left:12px;font-size:12px;color:var(--muted); }
.notice { margin-top:24px;border-radius:12px;border:1px solid var(--line);padding:14px 16px;color:var(--muted);font-size:11px; }
.footer { display:flex;gap:20px;justify-content:space-between;border-top:1px solid var(--line);color:var(--muted);font-size:11px;margin-top:30px;padding-top:21px; }
.footerlinks { display:flex;gap:12px;flex-wrap:wrap; }
.dialogCover { position:fixed;inset:0;z-index:10;background:rgba(17,25,20,.4);display:grid;place-items:center;padding:18px; }
.dialog { width:min(630px,100%);max-height:92dvh;overflow-y:auto;background:white;border-radius:17px;padding:29px;box-shadow:0 25px 70px #131e1633; }
.permissionRows { display:grid;gap:8px; }
.permissionRow { display:grid;grid-template-columns:1fr 1.1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px; }
.permissionRow b { font-weight:620; }
.kbd { font-family:ui-monospace,monospace;font-size:11px;color:var(--blue); }
.loadingNone { display:none; }
@media(max-width:900px) { .hero { flex-direction:column;align-items:start;margin-top:34px; } .stepper {flex-wrap:wrap;} .layout { grid-template-columns:1fr; } .side { grid-template-columns:1fr 1fr; } }
@media(max-width:650px) { .shell {padding:0 16px 35px;} .top {min-height:67px;} .brand {font-size:18px;} .brand small{display:none;} .hero{margin:36px 0 21px;} h1 {font-size:33px;} .panel{padding:19px;} .scenarios,.side {grid-template-columns:1fr;} .scenario {min-height:82px;} .step {padding:6px 1px;font-size:10px;gap:4px;} .step .n {width:19px;height:19px;} .stepper {gap:10px;} .permissionRow {grid-template-columns:1fr;gap:2px;} .topActions {gap:7px;} .footer{flex-direction:column;gap:10px;} .row.btnRow>.btn{flex:1;} }
@media(prefers-reduced-motion: reduce) { *{scroll-behavior:auto!important;transition:none!important;} }
</style>
</head>
<body>
<div id="app"></div>
<script src="./workflow-core.js"></script>
<script>
'use strict';
(function(){
  const VERSION = '0.2.0';
  const STORE = 'clarity-trainer-demo-v1';
  const QUESTIONS = [
    {key:'context',short:'背景与问题',title:'谁在什么场景下，遇到了什么具体问题？',prompt:'先描述现状和受影响的人。把“希望优化”转为可以观察的问题。',method:'Double Diamond · Discover',hint:'尝试写出：谁 + 场景 + 当前不理想的行为或结果。'},
    {key:'goal',short:'期望变化',title:'如果需求成功实现，会出现什么变化？',prompt:'描述实际成果，先不要锁定某个具体实现方案。',method:'Jobs to Be Done · Outcome',hint:'谁能够做什么以前做不到的事情？'},
    {key:'evidence',short:'事实依据',title:'有什么事实支持这个问题值得解决？',prompt:'可以是一项可复现的缺陷、一次用户反馈，也可以明确写“尚无证据”。',method:'Problem framing · Evidence',hint:'将已知事实与推测分开，例如：已观察 / 推断 / 待验证。'},
    {key:'constraints',short:'范围与约束',title:'哪些条件必须满足，哪些内容绝对不能改变？',prompt:'只定义真正重要的边界，给执行者保留实现空间。',method:'INCOSE · Necessary / Appropriate',hint:'明确保留项、禁止项、可选项，以及优先级。'},
    {key:'deliverable',short:'交付成果',title:'需要交付什么成果，交给谁使用？',prompt:'讲清产出与使用者，避免只要求“把它做好”。',method:'Working Backwards · Deliverable',hint:'例如：可运行模型、差异报告、演示、验证记录。'},
    {key:'acceptance',short:'验收证据',title:'什么可观察的证据证明需求已完成？',prompt:'给出条件、操作与可检查结果。无法确定的阈值应明确标记。',method:'INCOSE / EARS · Verifiable',hint:'建议写成：在 X 条件下执行 Y，应观察到 Z。'},
    {key:'unknown',short:'关键未知',title:'当前最可能改变方案的未知因素是什么？',prompt:'指出待确认信息及确认方式。保留必要的不确定性。',method:'QFT · Prioritize questions',hint:'例如：待获取参数、需要访谈的人、需运行的测试。'}
  ];
  const SCENARIOS = [
    {
      id:'embc',title:'修正 EMBC 运动学',caption:'工程研发 · 机械模型',initial:'优化 EMBC 偏心轴机械动画，保证真实、流畅，不影响其他功能。',
      answers:[
        '工程评审人员在操作当前 Three.js 模型时，发现非驱动侧夹钳臂错误地跟随偏心轴运动，和目标机械结构不一致。',
        '评审人员能观察到仅驱动侧偏心小轴绕固定主轴中心运动，非驱动侧夹钳臂绕同心铰轴旋转。',
        '已知设计约束：偏心轴仅存在于驱动力输出侧；当前动画中的另一侧错误绑定了偏心运动。实际尺寸仍需 CAD 核验。',
        '必须保留现有按钮、施加与缓解状态、参数配置；仅修改必要的运动学和绑定逻辑；禁止凭空指定未知几何参数。',
        '交付可运行的 Three.js 机械模型、关键运动学解释、修改前后对比及自动和人工验证记录，供机械设计评审使用。',
        '在制动施加与缓解全过程中，检查两侧转轴轨迹与约束关系符合参考 CAD；原控制按钮和状态切换的回归测试通过。',
        '偏心距、同心轴坐标、夹钳臂尺寸及运动容差待 CAD 核验；缺失时记录待确认项，不臆测数值。'
      ],
      challenge:'模型显示两侧夹钳臂都绕偏心轴转动，但动画非常流畅，且所有按钮正常。可以验收吗？',
      challengeOptions:['可以，流畅度和按钮功能已经达标','不可以，机构的核心运动约束不满足','可以，只要将问题放进后续版本'],
      challengeCorrect:1,
      teachback:'执行者复述：“我会保留现有操作功能，但将两侧夹钳臂统一绑定到偏心轴，确保运动协调。”',
      teachbackOptions:['理解一致，可以开始实现','存在理解偏差：非驱动侧应采用同心铰轴','无法判断，因为尚未确定动画帧率'],
      teachbackCorrect:1,
      lesson:'优先检验不可违反的物理约束。界面流畅不能抵消错误的机械拓扑。'
    },
    {
      id:'blog',title:'改进个人知识网站',caption:'产品设计 · 内容增长',initial:'把我的博客做得更简洁、好用，并且以后能放更多文章。',
      answers:[
        '网站当前围绕一篇文章组织内容；当文章增加到几十篇时，读者难以检索不同主题，维护者也难以保持链接稳定。',
        '读者能按主题检索并进入文章；维护者可持续增加内容且不破坏现有文章的稳定地址。',
        '当前内容组织为单一主题和来源。随着文章数量增加，导航和知识网络可用性可能下降，这一影响需要用模拟文章数据验证。',
        '保留所有原有有效文章链接；移动端可用；可以重构列表与导航，但不引入必须登录的阅读流程。',
        '交付可用的文章列表、主题筛选和知识网络入口，附迁移检查清单，供读者和网站维护者使用。',
        '用 100 篇模拟文章验证检索、过滤、详情页及移动端；所有原有稳定链接仍有效；关键阅读路径可完成。',
        '实际文章增长频率及主题分类仍需观察，先用 100 篇模拟数据测试，再决定是否需要更复杂的分类体系。'
      ],
      challenge:'100 篇文章都能显示，但过去的文章永久链接全部改变了。可以验收吗？',
      challengeOptions:['可以，容量目标已经满足','不可以，违反了稳定链接约束','可以，只要首页美观'],
      challengeCorrect:1,
      teachback:'执行者复述：“我会做新的文章列表，但将旧页面迁移到全新路径，原链接无需兼容。”',
      teachbackOptions:['理解一致','存在理解偏差：必须保留稳定链接','需要先补充主色调才能判断'],
      teachbackCorrect:1,
      lesson:'为增长预留结构，并将兼容性作为独立验收条件。'
    },
    {
      id:'ai',title:'定义 AI Agent 任务',caption:'AI 协作 · 验证闭环',initial:'帮我做一个可靠的 AI Agent，让它能自主完成复杂任务。',
      answers:[
        '项目负责人常将多步骤任务交给 Agent，但执行过程缺乏可追踪的状态和关键决策证据，无法快速判断工作是否完成。',
        '负责人能明确下达目标、检查关键控制点、追溯执行证据，并在必要时安全暂停或恢复任务。',
        '已观察到自动执行的中间结果需要人工重复核查；目前尚缺失败率基线，应先对模拟任务记录状态与错误。',
        '遵守最小权限；不默认访问真实账户；外部写操作必须得到授权；中断后状态可恢复；不泄露密钥。',
        '交付一个运行在隔离环境的最小 Agent 工作流、状态记录和异常恢复演示，以及一份权限配置清单。',
        '使用模拟 API 完成成功、失败、超时、暂停与恢复场景；验证每个状态都有证据、无授权时无法执行真实写操作。',
        '目标环境的可用 API、权限粒度和恢复策略需调查；在获取真实访问权限前只运行模拟数据。'
      ],
      challenge:'Agent 任务能完成，但没有操作审计，且可直接使用真实账户执行写操作。可以验收吗？',
      challengeOptions:['可以，任务执行成功最重要','不可以，违反可追溯和最小权限约束','可以，只要执行足够快'],
      challengeCorrect:1,
      teachback:'执行者复述：“为提高自主性，原型启动时会默认申请所有可用账户的读写权限。”',
      teachbackOptions:['理解一致','存在理解偏差：应从无权限开始逐项授权','权限与需求表达质量无关'],
      teachbackCorrect:1,
      lesson:'将权限、证据与故障路径作为验收要求，而非完成之后的附属工作。'
    }
  ];
  const customScenario = {id:'custom',title:'我的真实需求（本地练习）',caption:'自由输入 · 结构化追问',initial:'',answers:[],
    challenge:'已经完成主要交付物，但未执行约定的验收检查，也未明确关键未知项。可以宣告完成吗？',
    challengeOptions:['可以，交付物已经存在','不可以，验收证据和未知项仍缺失','可以，只要描述足够详细'],challengeCorrect:1,
    teachback:'执行者复述：“需求里没说明的部分，我会自行假定并直接实施，无需再次确认。”',
    teachbackOptions:['理解一致','存在理解偏差：重要未知项应标记并确认','无法判断，因为没有约定实现语言'],teachbackCorrect:1,
    lesson:'明确记录未知和验证路径，可降低执行者自行补全关键假设的风险。'};
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const has = (s) => !!s && s.trim() !== '[待确认]';
  const vagueWords=['优化','更好','合理','流畅','完善','快速','可靠','智能','尽量','高质量'];
  const initialState=()=>ClarityFlow.createSession({scenario:'embc',initial:SCENARIOS[0].initial});
  let state = initialState();
  try { const saved=JSON.parse(localStorage.getItem(STORE)||'null'); if(saved && typeof saved==='object' && ['setup','interview','challenge','review'].includes(saved.screen) && typeof saved.answers==='object') state=ClarityFlow.restore(saved)||initialState(); } catch (_) {}
  const scenario=()=> SCENARIOS.find(x=>x.id===state.scenario)||customScenario;
  const save=()=>{try{const {dialog,message,...safe}=state;localStorage.setItem(STORE,JSON.stringify(safe));}catch(_){}};
  function stepNo(){return ({setup:0,interview:1,challenge:2,review:3})[state.screen]??0;}
  function stepper(){return ['选择需求','澄清访谈','反例验证','评分复盘'].map((s,i)=>`<span class="step ${stepNo()===i?'active':stepNo()>i?'done':''}"><span class="n">${i+1}</span>${s}</span>`).join('');}
  function sideContent(){
    if(state.screen==='setup') return `<section class="panel"><div class="tag">METHOD / 01</div><h3 style="margin-top:10px">一轮训练的基本原则</h3><ul class="ruleList"><li><em>01</em>先定义问题，再选择方案</li><li><em>02</em>每轮只回答一个澄清问题</li><li><em>03</em>未知项可以明确保留</li><li><em>04</em>通过反例和复述检查理解</li></ul><div class="divider"></div><div class="callout">当前为规则驱动的模拟教练。它不会像接入语言模型的教练一样理解任意自由文本。评分是启发式诊断，不是能力测量量表。</div></section>`;
    if(state.screen==='interview')return `<section class="panel"><div class="tag">MENTAL MODEL</div><h3 style="margin-top:10px">这一轮训练什么</h3><p class="muted small">${esc(QUESTIONS[state.step]?.method||'')}</p><div class="divider"></div><h3>写作提示</h3><p class="muted small">${esc(QUESTIONS[state.step]?.hint||'')}</p><div class="divider"></div><div class="label">当前完成情况</div><div class="score" style="align-items:baseline"><strong style="font-size:25px">${Object.keys(state.answers).length}</strong><span class="muted small">/ ${QUESTIONS.length} 个问题</span></div><p class="muted micro">你可以明确写“待确认”；这不会被当作已解决的事实。</p></section>`;
    if(state.screen==='challenge')return `<section class="panel"><div class="tag">VALIDATION</div><h3 style="margin-top:10px">两项验证的作用</h3><div class="method"><b>反例测试</b><span>检查目标、约束与验收之间是否一致</span></div><div class="method"><b>Teach-Back</b><span>发现执行者复述时出现的理解偏差</span></div><div class="divider"></div><p class="muted small">模拟题目的正确答案由案例预置。自定义需求使用通用题，不提供真实语义层面的理解判定。</p></section>`;
    return `<section class="panel"><div class="tag">NEXT ITERATION</div><h3 style="margin-top:10px">建议练习路径</h3><p class="muted small">先修正得分最低的维度，再用一项实际验收或一次同伴复述测试验证修改效果。</p><div class="divider"></div><div class="callout">这个评分不能代表真实项目成功率。建议长期记录误解导致的返工和验收一致性，并按同类任务比较。</div></section>`;
  }
  function methodSide(){return `<section class="panel"><div class="label">研究基础 · 方法映射</div><div class="method"><b>Double Diamond / JTBD</b><span>问题与预期结果</span></div><div class="method"><b>QFT</b><span>明确高价值未知</span></div><div class="method"><b>INCOSE / EARS</b><span>约束与可验证条件</span></div><div class="method"><b>Teach-Back</b><span>理解一致性检查</span></div></section>`;}
  function setupMarkup(){return `<section class="panel" id="mainPanel"><div class="tag">START A SESSION</div><h2>从一个模糊需求开始</h2><p class="muted small">选择模拟情境，或使用自己的需求进行本地练习。</p><div class="divider"></div><span class="label">模拟情境</span><div class="scenarios">${SCENARIOS.map((s,i)=>`<button class="scenario ${state.scenario===s.id?'selected':''}" data-scenario="${s.id}" aria-pressed="${state.scenario===s.id}"><span class="num">0${i+1} / DEMO</span><b>${esc(s.title)}</b><span>${esc(s.caption)}</span></button>`).join('')}<button class="scenario ${state.scenario==='custom'?'selected':''}" data-scenario="custom" aria-pressed="${state.scenario==='custom'}"><span class="num">04 / YOURS</span><b>使用我的需求</b><span>自由填写 · 本地练习</span></button></div><div class="divider"></div><label class="label" for="initial">初始需求</label><textarea id="initial" aria-label="初始需求" placeholder="例如：帮我优化一个功能，让它更好用……">${esc(state.initial)}</textarea><p class="help">这句话可以很模糊。训练的目的就是逐步让它变清晰。</p><div class="row between" style="margin-top:18px"><span class="muted micro">约 7 轮澄清 · 2 项验证</span><button class="btn primary" id="start">开始训练 <span aria-hidden="true">→</span></button></div></section>`;}
  function interviewMarkup(){const q=QUESTIONS[state.step];let hist=QUESTIONS.slice(0,state.step).map(x=>`<div class="historyItem"><strong>${esc(x.short)}</strong><p>${esc(state.answers[x.key]||'[待确认]')}</p></div>`).join('');return `<section class="panel" id="mainPanel"><div class="row between"><span class="tag">INTERVIEW / ${String(state.step+1).padStart(2,'0')}</span><span class="muted small">${state.step+1} / ${QUESTIONS.length}</span></div><div class="progress">${QUESTIONS.map((_,i)=>`<i class="${i<=state.step?'filled':''}"></i>`).join('')}</div><div class="q">${esc(q.title)}</div><p class="prompt">${esc(q.prompt)}</p><label class="label" for="answer">你的回答</label><textarea id="answer" aria-label="当前访谈回答" rows="5" placeholder="用自己的话作答，越具体越好……">${esc(state.draft)}</textarea><p class="help" id="answerHelp">${esc(state.message||'不知道也可以。使用“暂时未知”明确保留需要后续核实的信息。')}</p><div class="row between btnRow" style="margin-top:19px"><button class="btn ghost" id="back">← 上一步</button><div class="row"><button class="btn" id="markUnknown">暂时未知</button><button class="btn" id="fillMock" ${state.scenario==='custom'?'disabled':''}>填入模拟回答</button><button class="btn primary" id="next">${state.step===QUESTIONS.length-1?'生成需求简报':'下一题'} →</button></div></div>${state.step>0?`<div class="divider"></div><details><summary class="small muted" style="cursor:pointer">查看前 ${state.step} 轮回答</summary><div class="history" style="margin-top:14px">${hist}</div></details>`:''}</section>`;}
  function briefs(){return [{label:'背景与问题',value:state.answers.context},{label:'目标',value:state.answers.goal},{label:'事实依据',value:state.answers.evidence},{label:'边界与约束',value:state.answers.constraints},{label:'交付物',value:state.answers.deliverable},{label:'验收证据',value:state.answers.acceptance},{label:'关键未知',value:state.answers.unknown}];}
  function briefMarkup(){return briefs().map(b=>`<div class="briefItem"><div class="briefHead"><span>${esc(b.label)}</span>${has(b.value)?'':'<span class="pending">待确认</span>'}</div><p>${esc(b.value||'[待确认]')}</p></div>`).join('');}
  function choicesMarkup(name,options,value){return `<div class="choiceSet">${options.map((x,i)=>`<button class="choice ${value===i?'selected':''}" data-choice="${name}" data-index="${i}" aria-pressed="${value===i}"><span class="radio">${value===i?'✓':''}</span><span>${esc(x)}</span></button>`).join('')}</div>`;}
  function challengeMarkup(){const s=scenario();return `<section class="panel" id="mainPanel"><span class="tag">SPECIFICATION</span><h2>把访谈转换为需求简报</h2><p class="muted small">下列信息完全来自你的回答。待确认内容不会被自动补全。</p><div class="brief">${briefMarkup()}</div><div class="divider"></div><div class="tag">TEST 01 / COUNTEREXAMPLE</div><h3 style="margin-top:10px">遇到边界情况，如何判定？</h3><p class="small muted">${esc(s.challenge)}</p>${choicesMarkup('stress',s.challengeOptions,state.stress)}<div class="divider"></div><div class="tag">TEST 02 / TEACH-BACK</div><h3 style="margin-top:10px">检查执行者的复述</h3><p class="small muted">${esc(s.teachback)}</p>${choicesMarkup('teachback',s.teachbackOptions,state.teachback)}<div class="row between btnRow" style="margin-top:24px"><button class="btn ghost" id="backFromChallenge">← 修改回答</button><button class="btn primary" id="score" ${state.stress===null||state.teachback===null?'disabled':''}>查看训练反馈 →</button></div></section>`;}
  function assess(){
    const a=state.answers,sc=scenario();
    const scoreGoal=!has(a.goal)?0:(a.goal.trim().length>=18 && !/^优化|^提高质量$/.test(a.goal.trim())?2:1);
    const scoreProblem=!has(a.context)?0:(has(a.evidence)&&a.context.trim().length>=18?2:1);
    const scoreBoundary=!has(a.constraints)?0:(a.constraints.trim().length>=20 && /保留|不得|不能|必须|禁止|仅|限制|上限|不引入|不可/.test(a.constraints)?2:1);
    const scoreVerify=!has(a.acceptance)?0:(a.acceptance.trim().length>=20 && /检查|观察|测试|核验|验证|通过|记录|测量|比对|检索/.test(a.acceptance)?2:1);
    const scoreAlign=(state.teachback===sc.teachbackCorrect?1:0)+(state.stress===sc.challengeCorrect?1:0);
    return [
      {label:'目标',value:scoreGoal,reason:scoreGoal===2?'期望结果包含具体的变化':'需要更具体地描述可观察的成功结果'},
      {label:'问题',value:scoreProblem,reason:scoreProblem===2?'描述了现状并补充依据':'补充受影响场景和事实依据'},
      {label:'边界',value:scoreBoundary,reason:scoreBoundary===2?'存在明确的必须保留或禁止条件':'补充真正关键的不可变条件'},
      {label:'验收',value:scoreVerify,reason:scoreVerify===2?'包含可检查的行为或证据':'写清测试条件、操作和期望结果'},
      {label:'理解对齐',value:scoreAlign,reason:scoreAlign===2?'两道模拟验证题回答正确':scoreAlign===1?'一项验证仍存在理解偏差':'需复查约束与接收者复述'}
    ];
  }
  function md(){const a=briefs().map(x=>`## ${x.label}\n${x.value||'[待确认]'}`).join('\n\n');const parts=assess();const total=parts.reduce((s,x)=>s+x.value,0);return `# 需求简报 · ${scenario().title}\n\n> 原始需求：${state.initial}\n> 训练模式：规则驱动模拟；评分为启发式自检。\n\n${a}\n\n## 模拟训练反馈\n得分：${total}/10\n${parts.map(x=>`- ${x.label}: ${x.value}/2 · ${x.reason}`).join('\n')}\n\n> 这份简报未经真实执行者确认；结构评分不代表语义正确。\n`;}
  function reviewMarkup(){const sc=scenario(),result=assess(),total=result.reduce((s,x)=>s+x.value,0),weak=result.filter(x=>x.value<2);return `<section class="panel" id="mainPanel"><div class="tag">TRAINING COMPLETE</div><h2>本轮复盘</h2><p class="muted small">依据结构启发式规则与两项预设题进行诊断。并非独立验证的能力评估。</p><div class="score" style="margin:23px 0 17px"><span class="bigscore" data-test="total-score">${total}</span><span class="scoreOutOf">/ 10</span><div style="flex:1"><div class="bar"><div class="barFill" style="width:${total*10}%"></div></div><p class="muted micro">五个维度，每项 0 到 2 分 · 无模型调用</p></div></div>${result.map(x=>`<div class="scoreItem"><div><b>${x.label}</b><span>${esc(x.reason)}</span></div><strong>${x.value} / 2</strong></div>`).join('')}<div class="divider"></div><h3>下一轮最值得改进什么？</h3><div class="callout ${weak.length===0?'ok':''}">${weak.length?`优先提升“${esc(weak[0].label)}”：${esc(weak[0].reason)}。`:`五项规则检查已达本轮满分。接下来用真实执行者复述和实际验收检验需求。`} ${esc(sc.lesson)}</div><div class="divider"></div><h3>需求简报</h3><div class="brief">${briefMarkup()}</div><div class="divider"></div><h3>六项原子判定</h3><p class="muted small">当前仅做规则预检查，模型调用 0 次。文本存在也不代表语义正确。后续可由 Jev 类判断器或人工逐项回答 YES / NO / UNKNOWN。</p>${ClarityFlow.propositions(state).map(p=>{const c=ClarityFlow.rulePrecheck(state).checks.find(x=>x.id===p.id);return `<div class="scoreItem" data-test="semantic-verdict"><div><b>${esc(p.question)}</b></div><strong>${c.decision==='UNKNOWN'?'待确认':'待语义核验'}</strong></div>`;}).join('')}<div class="row btnRow" style="margin-top:23px"><button class="btn primary" id="copyBrief">复制 Markdown</button><button class="btn" id="downloadBrief">导出 .md</button><button class="btn" id="trainAgain">再练一次</button></div><p id="copyStatus" class="muted micro" aria-live="polite"></p></section>`;}
  function dialogMarkup(){if(!state.dialog)return '';return `<div class="dialogCover" id="dialogCover"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="privacyTitle"><div class="row between"><span class="tag">PRIVACY BY DESIGN</span><button class="minilink" id="closeDialog" aria-label="关闭">关闭 ✕</button></div><h2 id="privacyTitle">账户与权限说明</h2><p class="muted small">当前训练流程采用离线静态页面和浏览器本地存储，无后台请求、外部 SDK 或账户登录。点击页脚研究来源链接才会访问对应第三方网站。</p><div class="permissionRows"><div class="permissionRow"><b>本地模拟 · 当前必需权限</b><span>无。仅使用浏览器运行 HTML / JS。为了恢复进度，会尝试保存本机 localStorage；拒绝或不可用时仍可训练。</span></div><div class="permissionRow"><b>真实 AI 动态访谈 · 未来必需</b><span>需要连接一个模型服务，并授权发送你主动提交的需求文本。应使用安全后端保管 API 凭据，绝不将密钥直接写入网页。</span></div><div class="permissionRow"><b>账户登录 / 跨设备同步</b><span>仅在启用时需要身份验证和受限数据存储权限。MVP 不需要 Gmail、Google Drive、GitHub 或日历。</span></div><div class="permissionRow"><b>第三方文件读取或写入</b><span>仅当你明确开启对应功能时申请相应最小范围权限。读取和修改应分开授权，默认禁用写权限。</span></div><div class="permissionRow"><b>隐私与留存</b><span>本地进度可能保留在同一浏览器配置中，可手动清除。本版本不上传、统计或同步任何文字。</span></div></div><div class="row between" style="margin-top:18px"><button class="btn" id="clearData">清除本地训练数据</button><button class="btn primary" id="confirmDialog">知道了</button></div></div></div>`;}
  function render(){save();const focus=document.activeElement?.id;const main =state.screen==='setup'?setupMarkup():state.screen==='interview'?interviewMarkup():state.screen==='challenge'?challengeMarkup():reviewMarkup();document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="brand"><span class="mark">c.</span> clarity.<small>需求表达训练台</small></div><div class="topActions"><span class="tinyBadge">● RULE-DRIVEN · 零模型</span><button class="minilink" id="privacy">权限与隐私</button></div></header><div class="hero"><div><div class="eyebrow">THINK BETTER · SPECIFY BETTER</div><h1>把模糊想法，练成清晰需求。</h1><p class="sub">一次只回答一个关键问题。从问题定义到可验证的共同理解。</p></div><nav class="stepper" aria-label="训练进度">${stepper()}</nav></div><main class="layout"><div>${main}<div class="notice">流程状态由确定性规则驱动，模型调用次数为 0。规则评分只检查有限文本特征；语义判断留给可插拔 YES / NO / UNKNOWN 判定器或人工复核。</div></div><aside class="side">${sideContent()}${methodSide()}</aside></main><footer class="footer"><span>clarity. · MVP ${VERSION} · Workflow first · Demo only</span><div class="footerlinks"><a href="https://www.designcouncil.org.uk/resources/the-double-diamond/" target="_blank" rel="noopener noreferrer">Design Council ↗</a><a href="https://rightquestion.org/what-is-the-qft/" target="_blank" rel="noopener noreferrer">QFT ↗</a><a href="https://www.incose.org/docs/default-source/working-groups/requirements-wg/guidetowritingrequirements/incose_rwg_gtwr_v4_summary_sheet.pdf?sfvrsn=73644bc7_2" target="_blank" rel="noopener noreferrer">INCOSE ↗</a><a href="https://www.ahrq.gov/teamstepps-program/curriculum/communication/tools/teachback.html" target="_blank" rel="noopener noreferrer">Teach-Back ↗</a></div></footer></div>${dialogMarkup()}`;
    bind();if(focus==='answer' && state.screen==='interview' && !state.dialog)document.getElementById('answer')?.focus(); }
  function move(event){const result=ClarityFlow.transition(state,event);state=result.state;render();return result.accepted;}
  function chooseScenario(id){const sc=SCENARIOS.find(x=>x.id===id)||customScenario;move({type:'SELECT_SCENARIO',scenario:sc.id,initial:sc.initial});}
  function start(){const field=document.getElementById('initial');state.initial=field?.value?.trim()||'';if(!state.initial){field?.focus();field?.setAttribute('aria-invalid','true');return;}move({type:'START',initial:state.initial});}
  function storeAnswer(value){move({type:'ANSWER',value});}
  function next(){const field=document.getElementById('answer');const value=(field?.value||'').trim();state.draft=value;if(!value){state.message='请写一句具体回答，或使用“暂时未知”标记未确定信息。';render();document.getElementById('answer')?.focus();return;}storeAnswer(value);}
  function back(){move({type:'BACK'});}
  function copyValue(str){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(str);}const input=document.createElement('textarea');input.value=str;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();const ok=document.execCommand('copy');input.remove();return ok?Promise.resolve():Promise.reject(new Error('copy unavailable'));}
  function download(){const blob=new Blob([md()],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='requirement-brief-'+state.scenario+'.md';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
  function bind(){
    document.querySelectorAll('[data-scenario]').forEach(el=>el.addEventListener('click',()=>chooseScenario(el.dataset.scenario)));
    document.getElementById('start')?.addEventListener('click',start);
    document.getElementById('initial')?.addEventListener('input',e=>{state.initial=e.target.value;save();});
    document.getElementById('answer')?.addEventListener('input',e=>{state.draft=e.target.value;save();});
    document.getElementById('back')?.addEventListener('click',back);
    document.getElementById('markUnknown')?.addEventListener('click',()=>storeAnswer('[待确认]'));
    document.getElementById('fillMock')?.addEventListener('click',()=>{const text=scenario().answers[state.step]||'';state.draft=text;state.message='';render();});
    document.getElementById('next')?.addEventListener('click',next);
    document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{move({type:'CHOOSE',field:el.dataset.choice,value:Number(el.dataset.index)});}));
    document.getElementById('backFromChallenge')?.addEventListener('click',()=>{move({type:'REVISE'});});
    document.getElementById('score')?.addEventListener('click',()=>{move({type:'FINISH'});});
    document.getElementById('copyBrief')?.addEventListener('click',()=>{copyValue(md()).then(()=>{document.getElementById('copyStatus').textContent='已复制需求简报。';}).catch(()=>{document.getElementById('copyStatus').textContent='复制不可用。可以使用“导出 .md”。';});});
    document.getElementById('downloadBrief')?.addEventListener('click',download);
    document.getElementById('trainAgain')?.addEventListener('click',()=>{move({type:'RESTART'});});
    document.getElementById('privacy')?.addEventListener('click',()=>{state.dialog=true;render();});
    ['closeDialog','confirmDialog'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>{state.dialog=false;render();}));
    document.getElementById('dialogCover')?.addEventListener('click',e=>{if(e.target.id==='dialogCover'){state.dialog=false;render();}});
    document.getElementById('clearData')?.addEventListener('click',()=>{try{localStorage.removeItem(STORE);}catch(_){}state=initialState();render();try{localStorage.removeItem(STORE);}catch(_){} });
  }
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.dialog){state.dialog=false;render();}});
  render();
  window.__clarityTest={getState:()=>JSON.parse(JSON.stringify(state)),assess,briefs,flow:ClarityFlow,version:VERSION};
})();
</script>
</body>
</html>
